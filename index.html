<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inmotech · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020;
    --card: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.14);
    --text: #f1f4ff;
    --muted: #9aa4c7;
    --accent: #6c8cff;
    --accent2: #a66bff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    z-index: 0;
    animation: float 14s ease-in-out infinite;
  }
  .b1 { width: 420px; height: 420px; background: var(--accent); top: -120px; left: -100px; }
  .b2 { width: 480px; height: 480px; background: var(--accent2); bottom: -160px; right: -120px; animation-delay: -5s; }
  .b3 { width: 260px; height: 260px; background: #2fd5c3; top: 55%; left: 55%; opacity: .3; animation-delay: -9s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.1); }
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 40px 34px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
    animation: rise .8s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  .logo {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(108, 140, 255, .45);
  }
  .logo svg { width: 28px; height: 28px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 28px; }
  .field { position: relative; margin-bottom: 16px; }
  .field input {
    width: 100%;
    padding: 22px 44px 8px 16px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, .09);
    box-shadow: 0 0 0 4px rgba(108, 140, 255, .18);
  }
  .field label {
    position: absolute;
    left: 16px; top: 17px;
    font-size: 15px;
    color: var(--muted);
    pointer-events: none;
    transition: all .18s ease;
    transform-origin: left top;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top: 8px;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: .03em;
  }
  .toggle {
    position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    padding: 6px; display: grid; place-items: center;
  }
  .toggle:hover { color: var(--text); }
  .toggle svg { width: 20px; height: 20px; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; margin: 4px 0 24px;
  }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(108, 140, 255, .4);
    transition: transform .15s, box-shadow .2s, opacity .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(108, 140, 255, .55); }
  .btn:active { transform: translateY(0); }
  .btn.loading { pointer-events: none; opacity: .85; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255, 255, 255, .4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .btn.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 12px; margin: 24px 0;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .social {
    padding: 12px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text); font: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .2s, transform .15s;
  }
  .social:hover { background: rgba(255, 255, 255, .12); transform: translateY(-1px); }
  .social svg { width: 18px; height: 18px; }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin-top: 26px; }
  .demo {
    text-align: center; font-size: 11px; color: var(--muted);
    margin-top: 18px; opacity: .7;
  }
  .toast {
    position: fixed; z-index: 5;
    bottom: 28px; left: 50%;
    transform: translate(-50%, 120px);
    background: rgba(20, 26, 50, .9);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    padding: 14px 22px; border-radius: 14px;
    font-size: 14px;
    transition: transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .toast.show { transform: translate(-50%, 0); }
  @media (max-width: 440px) { .card { padding: 32px 22px; } }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    </div>
    <h1>Bienvenido de nuevo</h1>
    <p class="sub">Ingresá a tu cuenta de Inmotech para continuar.</p>

    <form id="form">
      <div class="field">
        <input type="email" id="email" placeholder=" " autocomplete="off" required>
        <label for="email">Correo electrónico</label>
      </div>
      <div class="field">
        <input type="password" id="pass" placeholder=" " autocomplete="off" required>
        <label for="pass">Contraseña</label>
        <button type="button" class="toggle" id="toggle" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox"> Recordarme</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <button class="btn" id="btn" type="submit"><span class="spinner"></span><span id="btnText">Iniciar sesión</span></button>
    </form>

    <div class="divider">o continuá con</div>
    <div class="socials">
      <button class="social" type="button">
        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3-3C17.2 1.8 14.8.8 12 .8 7.7.8 4 3.3 2.2 6.9l3.5 2.7C6.600 7 9 5 12 5z"/><path fill="#4285F4" d="M23.200 12.200c0-.8-.1-1.500-.2-2.200H12v4.300h6.300c-.3 1.400-1.100 2.600-2.300 3.400l3.500 2.700c2-1.900 3.700-4.700 3.700-8.200z"/><path fill="#FBBC05" d="M5.700 14.300c-.2-.7-.4-1.500-.4-2.300s.1-1.600.4-2.300L2.200 7C1.500 8.500 1.100 10.200 1.100 12s.4 3.500 1.100 5l3.500-2.700z"/><path fill="#34A853" d="M12 23.200c3 0 5.500-1 7.300-2.700l-3.500-2.700c-1 .7-2.300 1.100-3.800 1.100-3 0-5.500-2-6.300-4.700L2.200 17c1.800 3.600 5.500 6.200 9.800 6.200z"/></svg>
        Google
      </button>
      <button class="social" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.600.5.500 5.600.5 12c0 5.100 3.300 9.400 7.900 10.900.6.100.8-.2.8-.6v-2c-3.200.7-3.900-1.500-3.900-1.500-.5-1.300-1.300-1.700-1.300-1.700-1-.7.100-.7.100-.7 1.200.1 1.800 1.200 1.800 1.200 1 1.800 2.700 1.300 3.300 1 .1-.7.4-1.300.7-1.600-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 0 1 5.800 0c2.200-1.500 3.200-1.200 3.200-1.200.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.200c0 .3.2.7.8.6 4.600-1.500 7.900-5.800 7.900-10.900C23.500 5.600 18.400.5 12 .5z"/></svg>
        GitHub
      </button>
    </div>

    <p class="foot">¿No tenés cuenta? <a href="#">Registrate</a></p>
    <p class="demo">Demo visual · no se envían ni guardan datos</p>
  </main>

  <div class="toast" id="toast">✨ Login simulado: ¡todo funciona!</div>

  <script>
    const pass = document.getElementById('pass');
    document.getElementById('toggle').addEventListener('click', () => {
      pass.type = pass.type === 'password' ? 'text' : 'password';
    });

    const btn = document.getElementById('btn');
    const text = document.getElementById('btnText');
    const toast = document.getElementById('toast');

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      btn.classList.add('loading');
      text.textContent = 'Ingresando…';
      setTimeout(() => {
        btn.classList.remove('loading');
        text.textContent = 'Iniciar sesión';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
      }, 1500);
    });

    document.querySelectorAll('a[href="#"]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
  </script>
</body>
</html>
